# English messages - natural translations of messages_hr.properties, same
# keys, same {0}/{1}/... placeholders. See MessageService for how this is
# loaded (UTF-8 Reader, not the classpath default lookup) and messages_hr for
# the authoritative Croatian copy this mirrors.

