# Croatian (default) messages for every backend-rendered, user-facing string:
# email subjects/headings/body copy, push-notification title/body, and
# validation/409/400 messages that are surfaced verbatim to the frontend.
#
# Saved as UTF-8 - loaded via MessageService with an explicit UTF-8 Reader
# (see that class's javadoc), not the classpath default ResourceBundle
# lookup, so the č/ć/ž/š/đ below are never subject to an encoding guess.
#
# Keys are dotted/hierarchical, grouped by feature area (mirrors the
# controller/service that owns the string). {0}/{1}/... are MessageFormat
# placeholders - see MessageService#t.

